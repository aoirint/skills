name: Check Skill source
description: Run workflow, script, APM, and Markdown source checks.

runs:
  using: composite
  steps:
    - name: Install workflow validation tools
      uses: ./.github/actions/install-workflow-tools

    - name: Check APM project metadata
      uses: ./.github/actions/check-apm-project
      with:
        expected-apm-version: "0.26.0"

    - name: Lint GitHub Actions and embedded shell
      shell: bash
      run: actionlint -color

    - name: Lint standalone shell
      shell: bash
      run: >-
        shellcheck
        .apm/skills/bepinex-mono-mod-quality-check/assets/github/actions/resolve-bepinex-version/resolve-version.sh
        .apm/skills/bepinex-mono-mod-quality-check/assets/github/actions/deploy-bepinex-thunderstore/publish-thunderstore.sh
        .apm/skills/bepinex-mono-mod-quality-check/scripts/test_resolve_version.sh
        .apm/skills/docker-quality-check/assets/github/actions/check-docker-source/install-hadolint.sh
        .apm/skills/python-quality-check/assets/github/actions/setup-python-locked/resolve-python-contract.sh
        .apm/skills/github-actions-quality-check/assets/github/actions/install-workflow-tools/install-workflow-tools.sh
        .apm/skills/node-quality-check/assets/github/actions/setup-node-locked/resolve-node-contract.sh
        .apm/skills/node-quality-check/scripts/test_resolve_node_contract.sh

    - name: Set up reviewed uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: false
        version: 0.11.21

    - name: Check Python helper formatting
      shell: bash
      run: >-
        uvx --from ruff==0.12.11 ruff format --check
        .apm/skills/apm-workflow/assets/check-apm-project/check_apm_project.py
        .apm/skills/apm-workflow/scripts/test_check_apm_project.py
        .apm/skills/github-actions-quality-check/scripts/check_composite_actions.py
        .apm/skills/github-actions-quality-check/scripts/test_check_composite_actions.py

    - name: Lint Python helpers
      shell: bash
      run: >-
        uvx --from ruff==0.12.11 ruff check
        .apm/skills/apm-workflow/assets/check-apm-project/check_apm_project.py
        .apm/skills/apm-workflow/scripts/test_check_apm_project.py
        .apm/skills/github-actions-quality-check/scripts/check_composite_actions.py
        .apm/skills/github-actions-quality-check/scripts/test_check_composite_actions.py

    - name: Type-check Python helpers
      shell: bash
      run: |
        uvx --from mypy==1.17.1 mypy --strict \
          .apm/skills/apm-workflow/assets/check-apm-project/check_apm_project.py
        uvx --from mypy==1.17.1 mypy --strict \
          .apm/skills/github-actions-quality-check/scripts/check_composite_actions.py
        uvx --from mypy==1.17.1 mypy --strict \
          .github/actions/check-apm-project/check_apm_project.py

    - name: Test Python helpers
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
      run: python .apm/skills/apm-workflow/scripts/test_check_apm_project.py

    - name: Test Composite Action contract checker
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: "1"
      run: |
        uvx --from coverage==7.10.4 coverage run --branch \
          .apm/skills/github-actions-quality-check/scripts/test_check_composite_actions.py
        uvx --from coverage==7.10.4 coverage report \
          --include='*/check_composite_actions.py' \
          --fail-under=100

    - name: Check Composite Action contracts
      shell: bash
      run: >-
        python
        .apm/skills/github-actions-quality-check/scripts/check_composite_actions.py
        .apm/skills

    - name: Test BepInEx version resolver
      shell: bash
      run: bash .apm/skills/bepinex-mono-mod-quality-check/scripts/test_resolve_version.sh

    - name: Verify immutable GitHub Actions pins
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: pinact run --check --min-age 7

    - name: Lint Markdown
      uses: DavidAnson/markdownlint-cli2-action@ce4853d43830c74c1753b39f3cf40f71c2031eb9 # v23.0.0
      with:
        config: .markdownlint-cli2.yaml
        globs: "**/*.md"
