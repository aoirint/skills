name: Main

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    # Re-run the required source check on the exact merged commit.
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Check out integrated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run source checks
        uses: ./.github/actions/check-repository-source
