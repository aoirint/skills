name: Main

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check
    # Re-run the required source check on the exact merged commit.
    runs-on: ubuntu-slim
    timeout-minutes: 15

    steps:
      - name: Check out integrated source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run source checks
        uses: ./.github/actions/check-repository-source
