name: Check Flet source
description: Run workflow, Python, type, and Markdown source checks.

runs:
  using: composite
  steps:
    - name: Install workflow validation tools
      uses: ./.github/actions/install-workflow-tools

    - name: Lint GitHub Actions syntax
      shell: bash
      run: actionlint -color

    - name: Verify immutable GitHub Actions pins
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: pinact run --check --min-age 7

    - name: Set up locked Python environment
      id: setup
      uses: ./.github/actions/setup-python-locked

    - name: Check Python formatting
      shell: bash
      run: uv run --locked ruff format --check .

    - name: Lint Python source
      shell: bash
      run: uv run --locked ruff check .

    - name: Type-check Python source
      shell: bash
      run: uv run --locked mypy src tests

    - name: Lint Markdown source
      uses: DavidAnson/markdownlint-cli2-action@ce4853d43830c74c1753b39f3cf40f71c2031eb9 # v23.0.0
      with:
        config: .markdownlint-cli2.yaml
        globs: "**/*.md"

    # setup-uv owns its runner cache; remove only the action-created project environment.
    - name: Remove Python dependencies
      if: always() && steps.setup.outputs.environment-owned == 'true'
      shell: bash
      run: rm -rf .venv
