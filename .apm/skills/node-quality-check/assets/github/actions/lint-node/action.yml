name: Lint Node.js
description: Install locked pnpm dependencies and run the repository lint script.

inputs:
  package-directory:
    description: Directory containing package.json, .node-version, and pnpm-lock.yaml.
    required: false
    default: .
  lockfile-path:
    description: Optional repository-relative pnpm lockfile path for a shared workspace lockfile.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Resolve the committed package-manager contract before package execution.
    - name: Resolve Node package contract
      id: contract
      shell: bash
      env:
        NODE_PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        NODE_LOCKFILE_PATH: ${{ inputs.lockfile-path }}
      run: bash "${{ github.action_path }}/resolve-node-contract.sh"

    # Install only the pnpm version declared by the selected package.
    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: ${{ steps.contract.outputs.pnpm-version }}

    # Align Node.js and the pnpm cache key with the selected package rather than with
    # an unrelated repository root or runner default.
    - name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.package-directory }}/.node-version
        cache: pnpm
        cache-dependency-path: ${{ steps.contract.outputs.lockfile-path }}

    # Replay the reviewed lockfile; do not let CI resolve a replacement dependency graph.
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      run: pnpm install --frozen-lockfile

    # Keep the composite focused on the repository's declared lint contract.
    - name: Run lint
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      run: pnpm run lint

    # Keep the cache in pnpm's store, but remove the job-local dependency tree.
    - name: Remove node_modules
      if: always()
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      run: rm -rf node_modules
