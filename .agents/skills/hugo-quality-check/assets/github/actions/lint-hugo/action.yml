name: Validate Hugo site
description: Install locked pnpm dependencies, lint content, and build the Hugo site.

inputs:
  package-directory:
    description: Directory containing package.json, .node-version, and pnpm-lock.yaml.
    required: false
    default: .
  lockfile-path:
    description: Optional repository-relative pnpm lockfile path for a shared workspace lockfile.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Resolve the cache key before setup so a missing lockfile fails before package resolution.
    - name: Resolve package paths
      id: paths
      shell: bash
      run: |
        lockfile_path='${{ inputs.lockfile-path }}'
        if [ -z "$lockfile_path" ]; then
          lockfile_path='${{ inputs.package-directory }}/pnpm-lock.yaml'
        fi
        test -f "$lockfile_path"
        printf 'lockfile-path=%s\n' "$lockfile_path" >> "$GITHUB_OUTPUT"

    # Read the package-manager contract without depending on a runner Node.js version.
    - name: Read pnpm version
      id: pnpm-version
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      run: |
        package_manager=$(grep -oE '"packageManager"[[:space:]]*:[[:space:]]*"[^"]+"' package.json | head -n 1 | sed -E 's/.*"([^"]+)"$/\1/')
        case "$package_manager" in
          pnpm@*) printf 'version=%s\n' "${package_manager#pnpm@}" >> "$GITHUB_OUTPUT" ;;
          *) echo "packageManager must specify pnpm@<version>" >&2; exit 1 ;;
        esac

    # Install only the pnpm version declared by the selected package.
    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: ${{ steps.pnpm-version.outputs.version }}

    # Use the committed runtime and lockfile as the Node.js and cache contracts.
    - name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.package-directory }}/.node-version
        cache: pnpm
        cache-dependency-path: ${{ steps.paths.outputs.lockfile-path }}

    # Replay the reviewed lockfile rather than resolving a new dependency graph.
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      run: pnpm install --frozen-lockfile

    # Validate content and configuration before the broader rendered-site build.
    - name: Run lint
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      run: pnpm run lint

    # Exercise Hugo mounts, themes, layouts, and the production output together.
    - name: Build Hugo site
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      run: pnpm run build

    # Retain pnpm's cache but remove the job-local dependency tree before returning.
    - name: Remove node_modules
      if: always()
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      run: rm -rf node_modules
