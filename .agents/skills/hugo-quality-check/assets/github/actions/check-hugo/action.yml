name: Check Hugo site
description: Install locked pnpm dependencies, lint content, and build the Hugo site.

inputs:
  package-directory:
    description: Directory containing package.json, .node-version, and pnpm-lock.yaml.
    required: false
    default: .
  lockfile-path:
    description: Optional repository-relative pnpm lockfile path for a shared workspace lockfile.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Resolve the committed package-manager contract before package execution.
    - name: Resolve Node package contract
      id: contract
      shell: bash
      env:
        NODE_PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        NODE_LOCKFILE_PATH: ${{ inputs.lockfile-path }}
      run: bash "${{ github.action_path }}/resolve-node-contract.sh"

    # Install only the pnpm version declared by the selected package.
    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: ${{ steps.contract.outputs.pnpm-version }}

    # Use the committed runtime and lockfile as the Node.js and cache contracts.
    - name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.package-directory }}/.node-version
        cache: pnpm
        cache-dependency-path: ${{ steps.contract.outputs.lockfile-path }}

    # Replay the reviewed lockfile rather than resolving a new dependency graph.
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      run: pnpm install --frozen-lockfile

    # Validate content and configuration before the broader rendered-site build.
    - name: Run lint
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      run: pnpm run lint

    # Exercise Hugo mounts, themes, layouts, and the production output together.
    - name: Build Hugo site
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      run: pnpm run build

    # Retain pnpm's cache but remove the job-local dependency tree before returning.
    - name: Remove node_modules
      if: always()
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      run: rm -rf node_modules
