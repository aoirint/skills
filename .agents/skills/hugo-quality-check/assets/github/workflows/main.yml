name: Main

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-slim

    steps:
      # Revalidate the merged site with its pinned theme sources and no retained credentials.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      # Use the same site validation boundary as proposed changes.
      - name: Validate Hugo site
        uses: ./.github/actions/lint-hugo
