name: Pull Request

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-slim

    steps:
      # Validate unmerged content and its pinned theme sources without persisted credentials.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      # Keep pull-request and merge-queue validation identical to integration validation.
      - name: Validate Hugo site
        uses: ./.github/actions/lint-hugo
