name: Check Node source
description: Audit APM, check locked Node and Markdown source, and remove action-owned dependencies.

inputs:
  package-directory:
    description: Directory containing package.json, .node-version, and pnpm-lock.yaml.
    required: false
    default: .
  lockfile-path:
    description: Optional repository-relative pnpm lockfile path for a shared workspace lockfile.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up reviewed APM CLI
      uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
      with:
        apm-version: "0.28.0"
        setup-only: "true"

    - name: Audit APM deployment
      shell: bash
      run: apm audit --ci

    - name: Set up locked Node environment
      id: setup
      uses: ./.github/actions/setup-node-locked
      with:
        package-directory: ${{ inputs.package-directory }}
        lockfile-path: ${{ inputs.lockfile-path }}

    - name: Check Node source
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      run: pnpm run lint

    - name: Lint Markdown source
      uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
      with:
        config: .markdownlint-cli2.yaml
        globs: "**/*.md"

    # The pnpm store remains runner-cache-managed; remove only the action-created dependency tree.
    - name: Remove Node dependencies
      if: always() && steps.setup.outputs.dependency-tree-owned == 'true'
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      run: rm -rf node_modules
