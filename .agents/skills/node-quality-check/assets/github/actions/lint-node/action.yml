name: Lint Node.js
description: Install locked pnpm dependencies and run the repository lint script.

inputs:
  package-directory:
    description: Directory containing package.json, .node-version, and pnpm-lock.yaml.
    required: false
    default: .

runs:
  using: composite
  steps:
    # Reads the exact pnpm version from the selected package.json.
    - name: Read pnpm version
      id: pnpm-version
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      run: |
        package_manager=$(node -p 'require("./package.json").packageManager')
        case "$package_manager" in
          pnpm@*) printf 'version=%s\n' "${package_manager#pnpm@}" >> "$GITHUB_OUTPUT" ;;
          *) echo "packageManager must specify pnpm@<version>" >&2; exit 1 ;;
        esac

    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: ${{ steps.pnpm-version.outputs.version }}

    # Reads Node.js and the lockfile from the selected package directory.
    - name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.package-directory }}/.node-version
        cache: pnpm
        cache-dependency-path: ${{ inputs.package-directory }}/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      run: pnpm install --frozen-lockfile

    - name: Run lint
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      run: pnpm run lint

    # Keep the cache in pnpm's store, but remove the job-local dependency tree.
    - name: Remove node_modules
      if: always()
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      run: rm -rf node_modules
