name: Lint Node.js
description: Install locked pnpm dependencies and run the repository lint script.

runs:
  using: composite
  steps:
    # Reads the exact pnpm version from package.json's packageManager field.
    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    # Reads Node.js from .node-version and caches pnpm's store.
    - name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Run lint
      shell: bash
      run: pnpm run lint

    # Keep the cache in pnpm's store, but remove the job-local dependency tree.
    - name: Remove node_modules
      if: always()
      shell: bash
      run: rm -rf node_modules
