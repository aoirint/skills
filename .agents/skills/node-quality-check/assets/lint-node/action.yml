name: Lint Node.js
description: Install locked pnpm dependencies and run the repository lint script.

runs:
  using: composite
  steps:
    # Reads the exact pnpm version from package.json's packageManager field.
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    # Reads Node.js from .node-version and caches pnpm's store.
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Run lint
      shell: bash
      run: pnpm run lint
