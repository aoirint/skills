name: Set up locked Python environment
description: Install reviewed uv/Python and synchronize the exact locked graph.

runs:
  using: composite
  steps:
    - name: Read committed toolchain versions
      id: toolchain
      shell: bash
      run: bash "${{ github.action_path }}/resolve-python-contract.sh"

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
        python-version: ${{ steps.toolchain.outputs.python_version }}
        version: ${{ steps.toolchain.outputs.uv_version }}

    - name: Verify the dependency lock
      shell: bash
      run: uv lock --check

    - name: Synchronize locked dependencies
      shell: bash
      run: uv sync --locked --all-groups
